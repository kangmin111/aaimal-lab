<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREATURE LAB - AI 생물 합성기</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1319;
            --panel-bg: rgba(16, 28, 38, 0.8);
            --dna-a-color: #e67e22;
            --dna-b-color: #3498db;
            --neon-blue: #00f3ff;
            --text-main: #ffffff;
            --text-muted: #8ab4f8;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Jua', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background: rgba(10, 20, 30, 0.95);
            border-right: 2px solid rgba(0, 243, 255, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-title {
            font-family: 'Black Han Sans', sans-serif;
            color: var(--neon-blue);
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .history-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            text-align: center;
            font-size: 0.9rem;
        }

        .main-content {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle at center, #1a2a3a 0%, #0b1319 100%);
        }

        .header-title {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 5px;
            color: #fff;
            text-shadow: 0 0 15px var(--neon-blue);
        }

        .header-subtitle {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        .lab-container {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 30px;
            width: 100%;
            max-width: 1100px;
        }

        .dna-panel {
            flex: 1;
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .dna-panel.a {
            border: 2px solid var(--dna-a-color);
            box-shadow: 0 0 20px rgba(230, 126, 34, 0.2);
        }

        .dna-panel.b {
            border: 2px solid var(--dna-b-color);
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.2);
        }

        .panel-title {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .dna-panel.a .panel-title { color: var(--dna-a-color); }
        .dna-panel.b .panel-title { color: var(--dna-b-color); }

        .animal-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-family: 'Jua', sans-serif;
            font-size: 1.5rem;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }

        .animal-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .center-console {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 400px;
        }

        .synthesize-btn {
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            font-family: 'Black Han Sans', sans-serif;
            font-size: 2rem;
            padding: 20px 40px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 0 0 10px var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .synthesize-btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.6);
        }

        .result-screen {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--neon-blue);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        #resultImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .loading-text {
            display: none;
            font-size: 1.5rem;
            color: var(--neon-blue);
            animation: pulse 1.5s infinite;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            width: 100%;
        }

        .action-btn {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            font-family: 'Jua', sans-serif;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; text-shadow: 0 0 20px var(--neon-blue); }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="historySidebar">
        <div class="sidebar-title">생성 히스토리</div>
        <!-- 기록이 여기에 추가됩니다 -->
    </div>

    <div class="main-content">
        <div class="header-title">CREATURE LAB</div>
        <div class="header-subtitle">AI 생물 합성기</div>

        <div class="lab-container">
            <div class="dna-panel a">
                <div class="panel-title">DNA A</div>
                <input type="text" id="dnaA" class="animal-input" placeholder="예: 호랑이" value="호랑이">
            </div>

            <div class="center-console">
                <button class="synthesize-btn" id="synthBtn" onclick="generateCreature()">합성하기</button>
                
                <div class="result-screen">
                    <div class="loading-text" id="loading">유전자 융합 중...</div>
                    <img id="resultImage" alt="합성된 생물">
                </div>

                <div class="action-buttons">
                    <button class="action-btn" onclick="downloadImage()">이미지 다운로드</button>
                    <button class="action-btn" onclick="shareCreature()">결과 공유하기</button>
                </div>
            </div>

            <div class="dna-panel b">
                <div class="panel-title">DNA B</div>
                <input type="text" id="dnaB" class="animal-input" placeholder="예: 독수리" value="독수리">
            </div>
        </div>
    </div>

    <script>
        async function generateCreature() {
            const animalA = document.getElementById('dnaA').value.trim();
            const animalB = document.getElementById('dnaB').value.trim();

            if (!animalA || !animalB) {
                alert("두 동물의 이름을 모두 입력해주세요!");
                return;
            }

            const btn = document.getElementById('synthBtn');
            const loading = document.getElementById('loading');
            const resultImg = document.getElementById('resultImage');

            btn.disabled = true;
            btn.style.opacity = '0.5';
            loading.style.display = 'block';
            resultImg.style.display = 'none';

            // 이미지 프롬프트 생성 (야생 배경의 초현실적 하이브리드)
            const promptText = `A high quality, hyper-realistic fantasy hybrid creature that is a perfect mix of a ${animalA} and a ${animalB}. The creature is standing in a wild, epic nature background. Cinematic lighting, highly detailed, 8k resolution.`;

            try {
                // 수정된 부분: 구글이 아니라 Vercel에 만들어둔 내 전용 서버로 요청을 보냄
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt: promptText })
                });

                if (!response.ok) {
                    throw new Error(`서버 에러: ${response.status}`);
                }

                const data = await response.json();
                
                // 구글 API 응답 구조에서 이미지 데이터 추출
                if (data.instances && data.instances.length > 0 && data.instances[0].image && data.instances[0].image.base64) {
                    const base64Image = data.instances[0].image.base64;
                    resultImg.src = `data:image/jpeg;base64,${base64Image}`;
                    resultImg.style.display = 'block';
                    
                    addHistory(animalA, animalB);
                } else {
                    alert("이미지 생성에 실패했습니다. 유전자 조합이 불안정합니다.");
                }
            } catch (error) {
                console.error(error);
                alert("합성 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
            } finally {
                btn.disabled = false;
                btn.style.opacity = '1';
                loading.style.display = 'none';
            }
        }

        function addHistory(a, b) {
            const sidebar = document.getElementById('historySidebar');
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerText = `${a} + ${b}`;
            sidebar.insertBefore(item, sidebar.children[1]);
        }

        function downloadImage() {
            const img = document.getElementById('resultImage');
            if (img.src && img.style.display !== 'none') {
                const link = document.createElement('a');
                link.href = img.src;
                link.download = `creature_lab_result.jpg`;
                link.click();
            } else {
                alert("먼저 동물을 합성해주세요!");
            }
        }

        function shareCreature() {
            alert("멋진 크리처네요! (공유 기능은 클라우드 DB 연동 후 활성화됩니다.)");
        }
    </script>
</body>
</html>
